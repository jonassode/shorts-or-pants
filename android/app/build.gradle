plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ciVersionCodeValue = providers.environmentVariable("CI_VERSION_CODE").orNull
def resolvedVersionCode = 1
if (ciVersionCodeValue != null && ciVersionCodeValue.matches("^\\d+$")) {
    resolvedVersionCode = ciVersionCodeValue.toInteger()
}
def ciKeystorePath = providers.environmentVariable("CI_KEYSTORE_PATH").orNull
def ciKeystorePassword = providers.environmentVariable("CI_KEYSTORE_PASSWORD").orNull
def ciKeyAlias = providers.environmentVariable("CI_KEY_ALIAS").orNull
def ciKeyPassword = providers.environmentVariable("CI_KEY_PASSWORD").orNull
def hasCiSigning = [ciKeystorePath, ciKeystorePassword, ciKeyAlias, ciKeyPassword].every { value ->
    value != null && !value.toString().trim().isEmpty()
}

android {
    namespace 'com.jonassode.shortsorpants'
    compileSdk 34

    defaultConfig {
        applicationId "com.jonassode.shortsorpants"
        minSdk 26
        targetSdk 34
        versionCode resolvedVersionCode
        versionName "1.0"
    }

    signingConfigs {
        if (hasCiSigning) {
            ci {
                storeFile file(ciKeystorePath)
                storePassword ciKeystorePassword
                keyAlias ciKeyAlias
                keyPassword ciKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (hasCiSigning) {
                signingConfig signingConfigs.ci
            }
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasCiSigning) {
                signingConfig signingConfigs.ci
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
