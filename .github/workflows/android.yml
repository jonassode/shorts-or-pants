name: Build Android APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Determine build target
        id: build_config
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "is_main_push=true" >> "$GITHUB_OUTPUT"
            echo "gradle_task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "artifact_name=shorts-or-pants-release" >> "$GITHUB_OUTPUT"
            echo "artifact_path=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "artifact_filename=shorts-or-pants-release.apk" >> "$GITHUB_OUTPUT"
            echo "release_dir=releases" >> "$GITHUB_OUTPUT"
            echo "release_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main_push=false" >> "$GITHUB_OUTPUT"
            echo "gradle_task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "artifact_name=shorts-or-pants-debug" >> "$GITHUB_OUTPUT"
            echo "artifact_path=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "artifact_filename=shorts-or-pants-debug.apk" >> "$GITHUB_OUTPUT"
            echo "release_dir=releases" >> "$GITHUB_OUTPUT"
            echo "release_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release signing secrets
        if: steps.build_config.outputs.release_build == 'true'
        env:
          ANDROID_CI_KEYSTORE_BASE64: ${{ secrets.ANDROID_CI_KEYSTORE_BASE64 }}
          ANDROID_CI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_CI_KEYSTORE_PASSWORD }}
          ANDROID_CI_KEY_ALIAS: ${{ secrets.ANDROID_CI_KEY_ALIAS }}
          ANDROID_CI_KEY_PASSWORD: ${{ secrets.ANDROID_CI_KEY_PASSWORD }}
        run: |
          for secret_name in ANDROID_CI_KEYSTORE_BASE64 ANDROID_CI_KEYSTORE_PASSWORD ANDROID_CI_KEY_ALIAS ANDROID_CI_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Missing required secret: ${secret_name}"
              exit 1
            fi
          done

      - name: Configure release signing
        if: steps.build_config.outputs.release_build == 'true'
        env:
          ANDROID_CI_KEYSTORE_BASE64: ${{ secrets.ANDROID_CI_KEYSTORE_BASE64 }}
          ANDROID_CI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_CI_KEYSTORE_PASSWORD }}
          ANDROID_CI_KEY_ALIAS: ${{ secrets.ANDROID_CI_KEY_ALIAS }}
          ANDROID_CI_KEY_PASSWORD: ${{ secrets.ANDROID_CI_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_CI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ci-signing.keystore"
          chmod 600 "$RUNNER_TEMP/ci-signing.keystore"
          {
            echo "CI_KEYSTORE_PATH=$RUNNER_TEMP/ci-signing.keystore"
            echo "CI_KEYSTORE_PASSWORD=$ANDROID_CI_KEYSTORE_PASSWORD"
            echo "CI_KEY_ALIAS=$ANDROID_CI_KEY_ALIAS"
            echo "CI_KEY_PASSWORD=$ANDROID_CI_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build APK
        env:
          CI_VERSION_CODE: ${{ github.run_number }}
        run: cd android && ./gradlew ${{ steps.build_config.outputs.gradle_task }} --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_config.outputs.artifact_name }}
          path: ${{ steps.build_config.outputs.artifact_path }}
          retention-days: 30

      - name: Commit APK to repository
        if: steps.build_config.outputs.is_main_push == 'true'
        run: |
          mkdir -p "${{ steps.build_config.outputs.release_dir }}"
          cp "${{ steps.build_config.outputs.artifact_path }}" "${{ steps.build_config.outputs.release_dir }}/${{ steps.build_config.outputs.artifact_filename }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.build_config.outputs.release_dir }}/${{ steps.build_config.outputs.artifact_filename }}"
          git diff --cached --quiet || git commit -m "chore: update Android APK [skip ci]"
          git push
